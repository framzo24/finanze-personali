spring:
  application:
    name: finanze-personali

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    it.francescozoni.finanzepersonali: DEBUG
    org.hibernate.SQL: OFF

server:
  port: ${PORT:8080}