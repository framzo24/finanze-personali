spring:
  application:
    name: finanze-personali

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    it.francescozoni.finanzepersonali: DEBUG
    #org.springframework.web: INFO
    org.hibernate.SQL: OFF

server:
  port: 8080