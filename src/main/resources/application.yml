spring:
  profiles:
    active: dev

  application:
    name: finanze-personali

  datasource:
    url: jdbc:h2:file:./data/finanze
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    it.francescozoni.finanzepersonali: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG