spring:
  application:
    name: finanze-personali

  datasource:
    url: jdbc:sqlite:/Users/francescozoni/FinanzePersonaliDatabase/finanze-personali.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    it.francescozoni.finanzepersonali: DEBUG
    org.hibernate.SQL: OFF

server:
  port: 8080