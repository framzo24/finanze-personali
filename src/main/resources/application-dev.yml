spring:
  application:
    name: finanze-personali

  datasource:
    url: jdbc:h2:file:./data/finanze-personali
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
        generate_statistics: true   # temporaneo, per misurare

app:
  security:
    jwt-secret: ${JWT_SECRET:francescozoni-finanze-personali-chiave-di-firma-jwt-2026}
    jwt-durata-giorni: 7
    accesso-libero: true      # permette l'accesso a francesco.zoni con campi vuoti
  cors:
    origins: http://localhost:4200,http://127.0.0.1:4200
  bollette:
    wifi-dal: 2025-01-01

logging:
  level:
    root: INFO
    it.francescozoni.finanzepersonali: DEBUG
    org.hibernate.stat: DEBUG       # temporaneo
    org.hibernate.SQL: OFF

server:
  port: 8080