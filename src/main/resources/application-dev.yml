spring:
  application:
    name: finanze-personali

  datasource:
    url: jdbc:h2:file:./data/finanze-personali
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
        generate_statistics: true   # temporaneo, per misurare

logging:
  level:
    root: INFO
    it.francescozoni.finanzepersonali: DEBUG
    org.hibernate.stat: DEBUG       # temporaneo
    org.hibernate.SQL: OFF

server:
  port: 8080