<main class="scelta">
  <header class="testa">
    <span class="logo"><mat-icon>account_balance_wallet</mat-icon></span>
    <h1>Come gestite le bollette?</h1>
    <p>Scegli il modo che somiglia di più alla tua casa. Potrai usarlo da subito, ma non potrai più cambiarlo.</p>
  </header>

  <div class="carte" role="radiogroup" aria-label="Modalità di gestione delle bollette">
    @for (m of modalita; track m.id) {
    <button type="button" class="carta" role="radio"
            [class.sel]="scelta() === m.id" [attr.aria-checked]="scelta() === m.id"
            (click)="scelta.set(m.id)">
      <span class="tile"><mat-icon>{{ m.icona }}</mat-icon></span>
      <h2>{{ m.titolo }}</h2>
      <p>{{ m.testo }}</p>
      <ul>
        @for (p of m.punti; track p) {
        <li><mat-icon>check</mat-icon>{{ p }}</li>
        }
      </ul>
      <span class="spunta"><mat-icon>check_circle</mat-icon></span>
    </button>
    }
  </div>

  <footer class="piede">
    <button mat-flat-button type="button" [disabled]="!scelta() || invio()" (click)="conferma()">
      {{ invio() ? 'Un attimo…' : 'Conferma e continua' }}
    </button>
    <button mat-button type="button" (click)="sessione.esci()">Esci</button>
  </footer>
</main>
