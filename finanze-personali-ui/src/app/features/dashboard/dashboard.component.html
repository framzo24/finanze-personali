<div class="dashboard-grid">

  <mat-card>

    <h3>Saldo</h3>

    <h1>

      {{dashboard?.saldo | currency:'EUR'}}

    </h1>

  </mat-card>


  <mat-card>

    <h3>Entrate</h3>

    <h1>

      {{dashboard?.totaleEntrate | currency:'EUR'}}

    </h1>

  </mat-card>


  <mat-card>

    <h3>Uscite</h3>

    <h1>

      {{dashboard?.totaleUscite | currency:'EUR'}}

    </h1>

  </mat-card>


  <mat-card>

    <h3>Saldo mese</h3>

    <h1>

      {{(dashboard?.entrateMeseCorrente ?? 0) - (dashboard?.usciteMeseCorrente ?? 0) | currency:'EUR'}}

    </h1>

  </mat-card>

</div>
