<h2 mat-dialog-title>
  Nuovo movimento
</h2>


<mat-dialog-content>

  <form [formGroup]="form">


    <mat-form-field appearance="outline">

      <mat-label>
        Descrizione
      </mat-label>

      <input matInput formControlName="descrizione">

    </mat-form-field>


    <mat-form-field appearance="outline">

      <mat-label>
        Importo
      </mat-label>

      <input
        matInput
        type="number"
        formControlName="importo">

    </mat-form-field>


    <mat-form-field appearance="outline">

      <mat-label>
        Tipo
      </mat-label>

      <mat-select formControlName="tipo">

        <mat-option value="ENTRATA">
          Entrata
        </mat-option>

        <mat-option value="USCITA">
          Uscita
        </mat-option>

      </mat-select>

    </mat-form-field>


    <mat-form-field
      appearance="outline"
      class="full-width">


      <mat-label>
        Categoria
      </mat-label>


      <mat-select
        formControlName="categoriaId">


        <mat-option
          *ngFor="let categoria of categorieFlat"
          [value]="categoria.id"
          [style.padding-left.px]="16 + (categoria.livello * 20)">

        <span>
          {{ categoria.icona || '📁' }}
          {{ categoria.nome }}
        </span>


        </mat-option>


      </mat-select>

      <button
        mat-button
        color="primary"
        type="button"
        (click)="nuovaCategoria()">


        + Nuova categoria


      </button>


    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>Data</mat-label>

      <input
        matInput
        [matDatepicker]="picker"
        formControlName="dataMovimento">

      <mat-datepicker-toggle
        matSuffix
        [for]="picker">
      </mat-datepicker-toggle>

      <mat-datepicker #picker></mat-datepicker>

      <mat-error *ngIf="form.get('dataMovimento')?.hasError('required')">
        La data è obbligatoria
      </mat-error>

    </mat-form-field>


  </form>


</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="annulla()">
    Annulla
  </button>

  <button
    mat-raised-button
    color="primary"
    (click)="salva()">

    Salva

  </button>

</mat-dialog-actions>
