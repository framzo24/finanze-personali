<header class="navbar">
  @if (showMenuButton()) {
  <button mat-icon-button aria-label="Apri menu" (click)="menuToggle.emit()">
    <mat-icon>menu</mat-icon>
  </button>
  }

  <span class="spacer"></span>

  <button
    mat-icon-button
    class="theme-toggle"
    [attr.aria-label]="theme.isDark() ? 'Passa al tema chiaro' : 'Passa al tema scuro'"
    (click)="theme.toggle()">
    <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button type="button" class="user" [matMenuTriggerFor]="menu" aria-label="Menu profilo">
    <span class="user-name">{{ sessione.utente()?.nome }}</span>
    <span class="avatar">{{ iniziale() }}</span>
  </button>

  <mat-menu #menu="matMenu" xPosition="before">
    <div class="menu-head">
      <strong>{{ sessione.utente()?.nome }} {{ sessione.utente()?.cognome }}</strong>
      <span>{{ sessione.utente()?.username }}</span>
    </div>
    <button mat-menu-item (click)="sessione.esci()">
      <mat-icon>logout</mat-icon>
      <span>Esci</span>
    </button>
  </mat-menu>
</header>
